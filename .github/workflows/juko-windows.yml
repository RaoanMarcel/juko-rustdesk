# Build do RustDesk (Windows x64) com o servidor da JU.KO embutido.
#
# Baseado em .github/workflows/flutter-build.yml, bridge.yml e
# third-party-RustDeskTempTopMostWindow.yml da tag 1.4.9 do RustDesk, reduzido a
# Windows x64 (sem ARM64, MSI, Sciter, assinatura de codigo). A unica alteracao no
# codigo-fonte e o passo "Embutir servidor da JU.KO", que troca:
#  - RENDEZVOUS_SERVERS e RS_PUB_KEY de libs/hbb_common/src/config.rs (servidor padrao);
#  - a chave publica que valida o custom.txt em src/common.rs (por uma chave efemera
#    gerada neste proprio job, cuja semente nunca sai do runner).
#
# Marca e comportamento do JUKO no codigo (versionado neste repositorio, nao em passos do workflow):
#  - tema escuro MIDNIGHT do sistema (flutter/lib/common.dart), icones e logo (.github/juko/gerar_icones.py);
#  - textos "RustDesk" -> "JUKO" so nos VALORES traduzidos (src/lang/ptbr.rs e en.rs);
#  - juko://pair (flutter/lib/common.dart, jukoPair): o app envia o proprio ID ao sistema JUKO.
#
# Do mesmo binario compilado saem DOIS executaveis, que diferem so pelo custom.txt
# (mecanismo oficial de "cliente customizado" do RustDesk) ao lado do rustdesk.exe:
#  - juko-suporte-install.exe (cliente): so mostra o ID; sem Configuracoes, sem aviso de servidor,
#    servidor travado, aprovacao por clique (nao precisa dar senha). O nome terminado em "install.exe"
#    faz o proprio RustDesk abrir o instalador ao executar (ver src/common.rs::is_setup): instala uma
#    vez, vira servico e o ID fica fixo;
#  - juko-agente-install.exe (agente): interface completa, com o servidor travado e sem os avisos.
#
# Servidor, chave e API NAO ficam no repositorio: entram por entrada (inputs) a cada execucao.
# A chave do servidor e a chave PUBLICA do hbbs (a mesma que qualquer cliente precisa conhecer para
# se conectar) e nao e segredo.
name: JUKO - RustDesk Windows x64

on:
  workflow_dispatch:
    inputs:
      server-host:
        description: "Endereco publico do servidor RustDesk (hbbs/hbbr) que fica embutido, sem http(s)://"
        required: true
      server-key:
        description: "Chave publica do hbbs (conteudo de id_ed25519.pub)"
        required: true
      api-url:
        description: "URL publica da API do JUKO que recebe o ID (https://...), a mesma do PUBLIC_API_URL"
        required: true
      release-tag:
        description: "Tag da release que recebe os instaladores"
        default: "juko-1.4.9-r3"

permissions:
  contents: write

env:
  JUKO_SERVER_HOST: ${{ inputs.server-host }}
  JUKO_SERVER_KEY: ${{ inputs.server-key }}
  JUKO_API_URL: ${{ inputs.api-url }}
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"

jobs:
  validar:
    runs-on: ubuntu-22.04
    steps:
      - name: Validar entradas (falha cedo, antes de gastar o build)
        shell: bash
        run: |
          set -euo pipefail
          case "${JUKO_SERVER_HOST}" in
            ""|localhost*|127.*|*://*|*" "*) echo "::error::server-host invalido (precisa ser um endereco alcancavel por outros computadores, sem http://)"; exit 1;;
          esac
          [ "${#JUKO_SERVER_KEY}" -eq 44 ] || { echo "::error::server-key invalida (a chave publica do hbbs tem 44 caracteres)"; exit 1; }
          case "${JUKO_API_URL}" in
            https://*) ;;
            *) echo "::error::api-url precisa comecar com https://"; exit 1;;
          esac
          echo "Entradas OK: servidor ${JUKO_SERVER_HOST}, API ${JUKO_API_URL}"

  bridge:
    needs: validar
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ env.BRIDGE_FLUTTER_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Flutter 3.22.3: extended_text 14 exige um Dart mais novo, entao rebaixa so para resolver.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  topmost:
    runs-on: windows-2022
    env:
      build_output_dir: RustDeskTempTopMostWindow/WindowInjection/x64/Release
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Download the source code
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow

      - name: Build the project
        run: |
          cd RustDeskTempTopMostWindow && git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: |
            ./${{ env.build_output_dir }}/WindowInjection.dll

  build-windows:
    name: windows-x64
    needs: [validar, bridge, topmost]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Embutir servidor da JU.KO
        shell: bash
        run: |
          set -euo pipefail
          CFG=libs/hbb_common/src/config.rs
          sed -i "s|^pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[\"[^\"]*\"\];|pub const RENDEZVOUS_SERVERS: \&[\&str] = \&[\"${JUKO_SERVER_HOST}\"];|" "$CFG"
          sed -i "s|^pub const RS_PUB_KEY: &str = \"[^\"]*\";|pub const RS_PUB_KEY: \&str = \"${JUKO_SERVER_KEY}\";|" "$CFG"
          grep -nE "^pub const (RENDEZVOUS_SERVERS|RS_PUB_KEY)" "$CFG"
          grep -qF "pub const RENDEZVOUS_SERVERS: &[&str] = &[\"${JUKO_SERVER_HOST}\"];" "$CFG" || { echo "::error::patch do servidor nao aplicou"; exit 1; }
          grep -qF "pub const RS_PUB_KEY: &str = \"${JUKO_SERVER_KEY}\";" "$CFG" || { echo "::error::patch da chave nao aplicou"; exit 1; }

      - name: Trocar a chave que valida o custom.txt por uma chave efemera
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pynacl
          # imprime SO a chave publica; a semente fica em $RUNNER_TEMP e nunca e publicada
          JUKO_SIGN_PK="$(python3 .github/juko/gerar_chave.py)"
          [ "${#JUKO_SIGN_PK}" -eq 44 ] || { echo "::error::chave publica invalida"; exit 1; }
          echo "JUKO_SIGN_PK=${JUKO_SIGN_PK}" >> "$GITHUB_ENV"
          COM=src/common.rs
          sed -i "s|const KEY: &str = \"5Qbwsde3unUcJBtrx9ZkvUmwFNoExHzpryHuPUdqlWM=\";|const KEY: \&str = \"${JUKO_SIGN_PK}\";|" "$COM"
          grep -n "const KEY: &str" "$COM"
          grep -qF "const KEY: &str = \"${JUKO_SIGN_PK}\";" "$COM" || { echo "::error::troca da chave do custom.txt nao aplicou"; exit 1; }
          if grep -q "5Qbwsde3unUcJBtrx9ZkvUmwFNoExHzpryHuPUdqlWM=" "$COM"; then echo "::error::chave oficial ainda presente em common.rs"; exit 1; fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0; https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: find Runner.res
        # Runner.res (compilado de flutter/windows/runner/Runner.rc) traz a versao real do exe
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Verificar que o binario aponta para o servidor da JU.KO
        shell: bash
        run: |
          set -euo pipefail
          ls -la rustdesk | head -30
          # o codigo Rust vira librustdesk.dll; se o patch nao chegou nele, o build nao pode ser publicado
          grep -qa "${JUKO_SERVER_HOST}" rustdesk/librustdesk.dll || { echo "::error::servidor ${JUKO_SERVER_HOST} nao esta no binario"; exit 1; }
          grep -qa "${JUKO_SERVER_KEY}" rustdesk/librustdesk.dll || { echo "::error::chave publica nao esta no binario"; exit 1; }
          # a chave que valida o custom.txt tem de ser a efemera deste build. (Nao da pra exigir a AUSENCIA da chave
          # oficial: ela aparece em textos de ajuda dos arquivos de idioma, entao sempre esta no binario.)
          grep -qaF "${JUKO_SIGN_PK}" rustdesk/librustdesk.dll || { echo "::error::chave efemera do custom.txt nao esta no binario"; exit 1; }
          if grep -qa "rs-ny.rustdesk.com" rustdesk/librustdesk.dll; then echo "::warning::ainda ha referencia a rs-ny.rustdesk.com no binario"; fi
          echo "OK: servidor, chave e chave de assinatura do custom.txt da JU.KO presentes em librustdesk.dll"

      - name: Gerar custom.txt assinados (cliente e agente)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/juko/gerar_custom.py ./custom-txt
          ls -l ./custom-txt
          [ -s ./custom-txt/custom-cliente.txt ] && [ -s ./custom-txt/custom-agente.txt ]

      - name: Build self-extracted executables (cliente e agente)
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/dpiAware/d' res/manifest.xml
          pip3 install -r libs/portable/requirements.txt
          mkdir -p ./SignOutput
          for variante in cliente agente; do
            # "install.exe" no fim do nome faz o RustDesk abrir o instalador ao executar
            case "${variante}" in cliente) arquivo="juko-suporte-install.exe";; agente) arquivo="juko-agente-install.exe";; esac
            # o RustDesk le custom.txt da pasta do exe; o empacotador leva a pasta inteira
            cp "./custom-txt/custom-${variante}.txt" ./rustdesk/custom.txt
            pushd ./libs/portable
            python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
            popd
            grep -qa "custom.txt" ./libs/portable/data.bin || { echo "::error::custom.txt nao entrou no pacote (${variante})"; exit 1; }
            mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${arquivo}"
          done
          cd SignOutput && sha256sum juko-*-install.exe | tee SHA256SUMS.txt && ls -l

      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ inputs.release-tag }}
          name: JUKO Suporte ${{ inputs.release-tag }}
          body: |
            JUKO Suporte (base RustDesk ${{ env.VERSION }}, Windows x64) com o servidor do JUKO embutido. Mesmo binario, dois
            executaveis que diferem so pelo `custom.txt` assinado (mecanismo oficial de cliente customizado do RustDesk):

            - `juko-suporte-install.exe` (cliente): abre o instalador ao executar (o nome terminado em `install.exe` e o gatilho oficial);
              instalado, o app fica em segundo plano e o ID passa a ser fixo. Sem Configuracoes, servidor travado, aprovacao por clique.
            - `juko-agente-install.exe` (agente): interface completa, com o servidor travado e sem os avisos.

            Alteracoes em relacao ao RustDesk ${{ env.VERSION }}: servidor e chave padrao (`libs/hbb_common/src/config.rs`), chave que valida o
            `custom.txt` (`src/common.rs`, efemera por build), tema/icones/textos e o link `juko://pair` (`flutter/lib/common.dart`).
            Codigo-fonte completo: este repositorio (licenca AGPL-3.0, igual ao RustDesk).
          files: |
            ./SignOutput/juko-suporte-install.exe
            ./SignOutput/juko-agente-install.exe
            ./SignOutput/SHA256SUMS.txt
